services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    env_file: ../.env
    environment:
      PYTHONPATH: /workspace:/workspace/services/url_shortener
    depends_on:
      - dynamodb-local

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -port 8001
    ports:
      - "8001:8001"
    volumes:
      - dynamodb-data:/home/dynamodblocal

volumes:
  dynamodb-data:
